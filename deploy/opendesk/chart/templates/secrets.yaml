{{- $ns := .Release.Namespace }}
{{- $name := .Values.secrets.name }}
{{- $prosody := include "synascriber.keep" (dict "ns" $ns "name" $name "key" "prosody-secret" "fallback" (randAlphaNum 64)) }}
{{- $token := include "synascriber.keep" (dict "ns" $ns "name" $name "key" "transcriber-token" "fallback" (randAlphaNum 64)) }}
{{- $apiKey := include "synascriber.keep" (dict "ns" $ns "name" $name "key" "api-key" "fallback" (printf "sk_%s" (randAlphaNum 48 | lower))) }}
# prosody-secret: HMAC between the plugin and the Prosody module.
# transcriber-token: Jitsi's bridge sends it to the transcriber.
# api-key: the transcriber's Synaplan API key (owner: the plugin owner).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "synascriber.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  prosody-secret: {{ $prosody | quote }}
  transcriber-token: {{ $token | quote }}
  api-key: {{ $apiKey | quote }}
---
# Environment of Jitsi's Prosody (extraEnvFrom).
apiVersion: v1
kind: Secret
metadata:
  name: synascriber-prosody
  labels:
    {{- include "synascriber.labels" . | nindent 4 }}
type: Opaque
stringData:
  SYNASCRIBER_SECRET: {{ $prosody | quote }}
---
# Environment of Jitsi's Jicofo (extraEnvFrom): custom-jicofo.conf reads
# ${?SYNASCRIBER_TRANSCRIBER_TOKEN} for the bridge's Authorization header.
apiVersion: v1
kind: Secret
metadata:
  name: synascriber-jicofo
  labels:
    {{- include "synascriber.labels" . | nindent 4 }}
type: Opaque
stringData:
  SYNASCRIBER_TRANSCRIBER_TOKEN: {{ $token | quote }}
