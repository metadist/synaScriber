# Meeting notes in openDesk's Jitsi (synaScriber). Generated by ./synascriber; no secrets.
jitsi:
  web:
    extraFiles:
      - path: "/usr/share/jitsi-meet/head.html"
        content: "<script defer src=\"https://synaplan.desk.synaplan.com/api/v1/user/1/plugins/synascriber/assets/jitsi/loader.js\" data-synaplan=\"https://synaplan.desk.synaplan.com\" data-issuer=\"https://id.desk.synaplan.com/realms/opendesk\" data-client-id=\"synascriber\"></script>\n"
      - path: "/usr/share/jitsi-meet/static/synascriber-silent.html"
        content: "<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Meeting notes sign-in</title>\n  </head>\n  <body>\n    <script>\n      // Keycloak redirects here (silent iframe or popup). Hand the code back to\n      // the synaScriber loader on the same origin, then go away.\n      (function () {\n        var message = { type: 'synascriber-auth', search: window.location.search }\n        var target = window.opener || (window.parent !== window ? window.parent : null)\n        if (target) {\n          target.postMessage(message, window.location.origin)\n        }\n        if (window.opener) {\n          window.close()\n        }\n      })()\n    </script>\n  </body>\n</html>\n"
  prosody:
    extraEnvs:
      XMPP_MODULES: "synascriber"
    extraEnvFrom:
      - secretRef:
          name: "synascriber-prosody"
          optional: true
    extraVolumes:
      - name: "synascriber-prosody"
        configMap:
          name: "synascriber-prosody"
          optional: true
    extraVolumeMounts:
      - name: "synascriber-prosody"
        mountPath: "/prosody-plugins-custom/mod_synascriber.lua"
        subPath: "mod_synascriber.lua"
        readOnly: true
    podAnnotations:
      "synascriber/module": "9bd7da3e51f9d921"
      "synascriber/secrets": "9c218c359f5c"
  jicofo:
    extraEnvFrom:
      - secretRef:
          name: "synascriber-jicofo"
          optional: true
    podAnnotations:
      "synascriber/secrets": "9c218c359f5c"
    custom:
      configs:
        _custom_jicofo_conf: "jicofo {\n  transcription {\n    url-template = \"ws://synascriber-transcriber.opendesk.svc.cluster.local:8095/transcribe?sessionId={{MEETING_ID}}\"\n    http-headers {\n      \"Authorization\" = \"Bearer \"${?SYNASCRIBER_TRANSCRIBER_TOKEN}\n    }\n  }\n}\n"
