{{- if .Values.rbac.create }}
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: {{ include "common.names.fullname" . }}
subjects:
  - kind: "ServiceAccount"
    name: {{ include "common.names.fullname" . }}
...
{{- end }}
