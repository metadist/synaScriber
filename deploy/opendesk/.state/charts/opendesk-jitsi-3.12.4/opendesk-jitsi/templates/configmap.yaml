---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "jitsi-meet-files"
data:
  favicon.svg: |
    {{- .Values.theme.imagery.faviconSvgB64 | b64dec | nindent 4 }}
  url-ics: |
    https://{{ .Values.global.hosts.intercomService }}.{{ .Values.global.domain }}
  url-logo: |
    https://{{ .Values.global.hosts.keycloak }}.{{ .Values.global.domain }}/opendesk-static-files/login/logo.svg
  url-portal: |
    https://{{ .Values.global.hosts.nubus }}.{{ .Values.global.domain }}
  watermark.svg: |
    {{- .Values.theme.imagery.logoHeaderInvertedSvgB64 | b64dec | nindent 4 }}
{{ (.Files.Glob "files/web/meet.oidc.conf").AsConfig | nindent 2 }}
{{ (.Files.Glob "files/web/oidc-adapter.html").AsConfig | nindent 2 }}
{{ (.Files.Glob "files/web/oidc-redirect.html").AsConfig | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/branding.json").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/custom-config.js").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/custom-interface_config.js").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/dialin-phone-numbers.json").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/lang-overwritten-de.json").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/lang-overwritten-en.json").AsConfig) . | nindent 2 }}
{{ tpl ((.Files.Glob "files/web/plugin.head.html").AsConfig) . | nindent 2 }}

{{- $bodyFile := "files/web/body.html" }}
{{- if .Values.theme.enableOldTopbar }}
{{- $bodyFile = "files/web/body.old.html" }}
{{- end }}

  body.html: |
{{- .Files.Get $bodyFile | nindent 4 }}
---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "jitsi-meet-binaries"
binaryData:
  welcome-background.jpg: |-
    {{ .Files.Get "files/web/welcome-background.jpg" | b64enc }}
---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "jitsi-keycloak-adapter-files"
data:
{{ (.Files.Glob "files/jitsi-keycloak-adapter/context.ts").AsConfig | nindent 2 }}

{{- if and
       .Values.jitsi.jvb.service.enabled
       .Values.patchJVB.enabled
}}
{{-   $jvb := include "opendesk-jitsi.jvb.fullname" . }}
{{-   $indexes := "" }}
{{-   range $i := until (int (.Values.jitsi.jvb.portRangeSize | default 1)) }}
{{-     $indexes = printf "%s%d " $indexes $i }}
{{-   end }}
---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: {{ include "common.names.fullname" . }}
data:
  init.sh: |
    #!/bin/sh
    set -e

    service="{{ $jvb }}"

    {{- if (eq .Values.jitsi.jvb.service.type "LoadBalancer") }}
    counter=0
    maxRetries=30

    until [ $counter -gt ${maxRetries} ]; do
      echo "Wait for LoadBalancer IP (${counter}/${maxRetries})"
      ip=$(
        kubectl get svc $service \
          -o jsonpath='{.status.loadBalancer.ingress[0].{{ .Values.patchJVB.configuration.loadbalancerStatusField }}}' \
        || true
      );

      if [ ${ip} ]; then
        break;
      else
        counter=$((counter + 1));
        sleep 5;
      fi
    done

    if [ -z "${ip}" ]; then
      echo "No LoadBalancer IP found, exiting..."
      exit 1
    fi;

    # The service publishes each JVB on its own port and those ports already
    # match JVB_PORT. Only the address has to be advertised.
    for i in {{ $indexes }}; do
      deployment="{{ $jvb }}-${i}"

      echo "Patching ${deployment} to advertise ${ip}"
      kubectl patch deployment $deployment --type strategic --patch \
        "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"jitsi\",\"env\":[{\"name\":\"JVB_ADVERTISE_IPS\",\"value\":\"${ip}\"}]}]}}}}"

      # Patching the env above already changes the pod template, so Kubernetes
      # rolls the pods on its own. No explicit restart is needed.
    done
    {{- else if (eq .Values.jitsi.jvb.service.type "NodePort") }}
    # The node ports are assigned by Kubernetes, so they are only known now.
    # Every JVB is made to listen on its own node port, which keeps the port it
    # advertises and the port clients reach identical. The address is only
    # advertised when one is configured; otherwise JVB finds it itself.
    for i in {{ $indexes }}; do
      deployment="{{ $jvb }}-${i}"

      servicePort=$(
        kubectl get svc $service \
          -o jsonpath="{.spec.ports[?(@.name=='rtp-udp-${i}')].port}"
      )

      port=$(
        kubectl get svc $service \
          -o jsonpath="{.spec.ports[?(@.name=='rtp-udp-${i}')].nodePort}"
      )

      if [ -z "${port}" ]; then
        echo "No node port found for rtp-udp-${i}, exiting..."
        exit 1
      fi

      # The service resolves the container port by name and containerPort is
      # the merge key of that list: patching the entry the chart renders makes
      # Helm re-add its own on the next upgrade, under a name the pod already
      # has. So the node port gets an entry of its own, named after the port,
      # which keeps a reassigned one distinct too.
      name="rtp-udp-${port}"
      declared="{\"name\":\"${name}\",\"containerPort\":${port},\"protocol\":\"UDP\"}"

      echo "Declaring ${port} on ${deployment} as ${name}"
      kubectl patch deployment $deployment --type strategic --patch \
        "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"jitsi\",\"ports\":[${declared}]}]}}}}"

      # No such collision here: the merge key is the service port, which stays
      # as rendered. Only targetPort moves.
      echo "Resolving ${service} port ${servicePort} to ${name}"
      kubectl patch svc $service --type strategic --patch \
        "{\"spec\":{\"ports\":[{\"port\":${servicePort},\"targetPort\":\"${name}\"}]}}"

      env="{\"name\":\"JVB_PORT\",\"value\":\"${port}\"}"
      {{- with .Values.patchJVB.configuration.staticLoadbalancerIP }}
      echo "Patching ${deployment} to advertise {{ . }}"
      env="${env},{\"name\":\"JVB_ADVERTISE_IPS\",\"value\":\"{{ . }}\"}"
      {{- end }}

      kubectl patch deployment $deployment --type strategic --patch \
        "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"jitsi\",\"env\":[${env}]}]}}}}"

      # Patching the env above already changes the pod template, so Kubernetes
      # rolls the pods on its own. No explicit restart is needed.
    done
    {{- end }}
{{- end }}
...
