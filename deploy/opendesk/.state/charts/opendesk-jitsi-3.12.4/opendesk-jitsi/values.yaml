---
# The global properties are used to configure multiple charts at once.
global:
  # -- The Top-Level-Domain (TLD) name which is used in f.e. in Ingress component.
  domain: "souvap-univention.de"

  # Define the Subdomain for components used in f.e. in Ingress component.
  hosts:
    # -- Subdomain for Jitsi, results in "https://{{ jitsi }}.{{ domain }}".
    jitsi: "meet"
    # -- Subdomain for ICS, results in "https://{{ intercomService }}.{{ domain }}".
    intercomService: "ics"
    # -- Subdomain for Keycloak, results in "https://{{ keycloak }}.{{ domain }}".
    keycloak: "id"
    # -- Subdomain for the portal.
    # Results in "https://{{ nubus }}.{{ domain }}".
    # The value is used to set the hyperlink on the watermark.
    nubus: "portal"

  # -- Container registry address.
  registry: "docker.io"

  # -- Credentials to fetch images from private registry
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  #
  # imagePullSecrets:
  #   - "docker-registry"
  #
  imagePullSecrets: []

# -- Affinity for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
# Note: podAffinityPreset, podAntiAffinityPreset, and  nodeAffinityPreset will be ignored when it's set
affinity: {}

# Helm release cleanup setting.
cleanup:
  # -- Keep Pods/Job logs after successful run.
  deletePodsOnSuccess: true
  # -- Keep persistence on delete of this release.
  keepPVCOnDelete: false

# Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
containerSecurityContext:
  # -- Enable container privileged escalation.
  allowPrivilegeEscalation: false

  # -- Run the container in privileged mode.
  privileged: false

  # -- Enable security context.
  enabled: true

  # -- Mounts the container's root filesystem as read-only.
  readOnlyRootFilesystem: true

  # -- Security capabilities for container.
  capabilities:
    drop:
      - "ALL"

  # -- Set Seccomp profile.
  seccompProfile:
    type: "RuntimeDefault"

  # -- Process user id.
  runAsUser: 1993

  # -- Process group id.
  runAsGroup: 1993

  # -- Run container as user.
  runAsNonRoot: true

# -- Array with extra environment variables to add to containers.
#
# extraEnvVars:
#   - name: FOO
#     value: "bar"
#
extraEnvVars: []

# -- Optionally specify extra list of additional volumes
extraVolumes: []

# -- Optionally specify extra list of additional volumeMounts.
extraVolumeMounts: []

# -- Provide a name to substitute for the full names of resources.
fullnameOverride: ""

# Container image section.
image:
  # -- Container registry address. This setting has higher precedence than global.registry.
  registry: "ghcr.io"

  # -- Container repository string.
  repository: "nordeck/jitsi-keycloak-adapter"

  # -- Define an ImagePullPolicy.
  #
  # Ref.: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  #
  # "IfNotPresent" => The image is pulled only if it is not already present locally.
  # "Always" => Every time the kubelet launches a container, the kubelet queries the container image registry to
  #             resolve the name to an image digest. If the kubelet has a container image with that exact digest cached
  #             locally, the kubelet uses its cached image; otherwise, the kubelet pulls the image with the resolved
  #             digest, and uses that image to launch the container.
  # "Never" => The kubelet does not try fetching the image. If the image is somehow already present locally, the
  #            kubelet attempts to start the container; otherwise, startup fails
  #
  imagePullPolicy: "IfNotPresent"

  # -- Define image tag.
  tag: "v20260623@sha256:d4c08aaba0354b7fa8e552bc10f35e7c54538b93ddd836b5940dc25d41e6d3a4"

job:
  # -- Annotations for job template
  # Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}

# After deployment of JVB service, the job fetches the provisioned LoadBalancer IP or NodePort port to advertise.
patchJVB:
  # -- Set the patchJVB job's backoffLimit
  backoffLimit: 10

  # -- Seconds after which a finished patchJVB job (and its pod) is automatically
  # cleaned up by the TTL controller. Successful runs are already removed by the
  # Helm hook-delete-policy, so this mainly bounds how long a FAILED job is kept
  # for debugging (default: 1 day).
  ttlSecondsAfterFinished: 86400

  # Job configuration
  configuration:
    # -- Relevant for NodePort deployments only, where it is optional.
    # In case you have a different egress gateway and thus the incoming ip can
    # not be autodiscovered, provide the ip of your ingress gateway. Leave it
    # empty to let JVB discover its own address; the job sets the node port
    # either way.
    staticLoadbalancerIP: ""

    # -- Relevant for LoadBalancer deployment only.
    # The IP/DNS of your load-balancer will be fetched from the status entry of
    # service - here you can define which field should be taken.
    loadbalancerStatusField: "ip"

  # Security Context.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  containerSecurityContext:
    # -- Enable container privileged escalation.
    allowPrivilegeEscalation: false

    # -- Run the container in privileged mode.
    privileged: false

    # -- Security capabilities for container.
    capabilities:
      drop:
        - "ALL"

    # -- Enable security context.
    enabled: true

    # -- Mounts the container's root filesystem as read-only.
    readOnlyRootFilesystem: true

    # -- Require the container to run as a non-root user.
    runAsNonRoot: true

    # -- Seccomp profile for the container.
    seccompProfile:
      type: "RuntimeDefault"

    # -- Run the container as this (non-zero) user. Matches the kubectl image's
    # built-in non-root user.
    runAsUser: 1001

    # -- Process group id.
    runAsGroup: 1001

  # -- Enable post deployment advertisement for LoadBalancer IP or NodePort port to JVB.
  enabled: true

  image:
    # -- Container registry address. This setting has higher precedence than global.registry.
    registry: ""

    # -- Container repository string.
    repository: "bitnami/kubectl"

    # -- Define an ImagePullPolicy.
    #
    # Ref.: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    #
    # "IfNotPresent" => The image is pulled only if it is not already present locally.
    # "Always" => Every time the kubelet launches a container, the kubelet queries the container image registry to
    #             resolve the name to an image digest. If the kubelet has a container image with that exact digest
    #             cached locally, the kubelet uses its cached image; otherwise, the kubelet pulls the image with
    #             the resolved digest, and uses that image to launch the container.
    # "Never" => The kubelet does not try fetching the image. If the image is somehow already present locally, the
    #            kubelet attempts to start the container; otherwise, startup fails
    #
    imagePullPolicy: "IfNotPresent"

    # -- Define image tag.
    tag: "1.33.4@sha256:681609aff6bf316acf464d9c9e369d84c49d50be6379247291b01ac311a7f5f5"

  # -- Credentials to fetch images from private registry
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  #
  # imagePullSecrets:
  #   - "docker-registry"
  #
  imagePullSecrets: []

  # Pod Security Context.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    # -- Enable security context.
    enabled: false

  # Configure resource requests and limits.
  #
  # http://kubernetes.io/docs/user-guide/compute-resources/
  #
  resources:
    limits:
      # -- The max amount of CPUs to consume.
      cpu: "100m"
      # -- The max amount of RAM to consume.
      memory: "128Mi"
    requests:
      # -- The amount of CPUs which has to be available on the scheduled node.
      cpu: "10m"
      # -- The amount of RAM which has to be available on the scheduled node.
      memory: "16Mi"

# -- Credentials to fetch images from private registry
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
#
# imagePullSecrets:
#   - "docker-registry"
#
imagePullSecrets: []

jitsi:
  publicURL: "https://jitsi.mydomain.tld"
  supportURL: ""
  enableAuth: true
  enableGuests: true

  image:
    # -- Default ImagePullPolicy for all Jitsi containers, including the init
    # containers. Components may override it per image.
    pullPolicy: "IfNotPresent"

  websockets:
    xmpp:
      enabled: true

  web:
    replicaCount: 1
    image:
      tag: "stable-11248@sha256:4395cab855270c5e66a4e190a7103f0876d0c60d5e64cb7abd01e581fb3bfe0e"
    extraConfig:
      disableThirdPartyRequests: false
      doNotStoreRoom: false
      dialinCountryCode: "DE"
      # e.g. "+49 1111 22233344"
      dialinPhoneNumbers: ""
    extraEnvs:
      # This value will be replace with internal conference mapper later when
      # it is ready.
      CONFCODE_URL: "https://jitsi-api.jitsi.net/conferenceMapper"
      DIALIN_NUMBERS_URL: "/static/dialin-phone-numbers.json"
    extraVolumes:
      - name: "jitsi-meet-files"
        configMap:
          name: "jitsi-meet-files"
          items:
            - key: "body.html"
              path: "body.html"
            - key: "branding.json"
              path: "branding.json"
            - key: "custom-config.js"
              path: "custom-config.js"
            - key: "custom-interface_config.js"
              path: "custom-interface_config.js"
            - key: "dialin-phone-numbers.json"
              path: "dialin-phone-numbers.json"
            - key: "favicon.svg"
              path: "favicon.svg"
            - key: "lang-overwritten-de.json"
              path: "lang-overwritten-de.json"
            - key: "lang-overwritten-en.json"
              path: "lang-overwritten-en.json"
            - key: "meet.oidc.conf"
              path: "meet.oidc.conf"
            - key: "oidc-adapter.html"
              path: "oidc-adapter.html"
            - key: "oidc-redirect.html"
              path: "oidc-redirect.html"
            - key: "plugin.head.html"
              path: "plugin.head.html"
            - key: "url-ics"
              path: "url-ics"
            - key: "url-logo"
              path: "url-logo"
            - key: "url-portal"
              path: "url-portal"
            - key: "watermark.svg"
              path: "watermark.svg"
      - name: "jitsi-meet-binaries"
        configMap:
          name: "jitsi-meet-binaries"
          items:
            - key: "welcome-background.jpg"
              path: "welcome-background.jpg"
    extraVolumeMounts:
      - name: "jitsi-meet-files"
        subPath: "custom-config.js"
        mountPath: "/config/custom-config.js"
      - name: "jitsi-meet-files"
        subPath: "custom-interface_config.js"
        mountPath: "/config/custom-interface_config.js"
      - name: "jitsi-meet-files"
        subPath: "meet.oidc.conf"
        mountPath: "/defaults/meet.conf"
      - name: "jitsi-meet-files"
        subPath: "body.html"
        mountPath: "/usr/share/jitsi-meet/body.html"
      - name: "jitsi-meet-files"
        subPath: "plugin.head.html"
        mountPath: "/usr/share/jitsi-meet/plugin.head.html"
      - name: "jitsi-meet-files"
        subPath: "favicon.svg"
        mountPath: "/usr/share/jitsi-meet/images/favicon.svg"
      - name: "jitsi-meet-files"
        subPath: "watermark.svg"
        mountPath: "/usr/share/jitsi-meet/images/watermark.svg"
      - name: "jitsi-meet-binaries"
        subPath: "welcome-background.jpg"
        mountPath: "/usr/share/jitsi-meet/images/welcome-background.jpg"
      - name: "jitsi-meet-files"
        subPath: "branding.json"
        mountPath: "/usr/share/jitsi-meet/static/branding.json"
      - name: "jitsi-meet-files"
        subPath: "dialin-phone-numbers.json"
        mountPath: "/usr/share/jitsi-meet/static/dialin-phone-numbers.json"
      - name: "jitsi-meet-files"
        subPath: "lang-overwritten-de.json"
        mountPath: "/usr/share/jitsi-meet/static/lang-overwritten-de.json"
      - name: "jitsi-meet-files"
        subPath: "lang-overwritten-en.json"
        mountPath: "/usr/share/jitsi-meet/static/lang-overwritten-en.json"
      - name: "jitsi-meet-files"
        subPath: "oidc-adapter.html"
        mountPath: "/usr/share/jitsi-meet/static/oidc-adapter.html"
      - name: "jitsi-meet-files"
        subPath: "oidc-redirect.html"
        mountPath: "/usr/share/jitsi-meet/static/oidc-redirect.html"
      - name: "jitsi-meet-files"
        subPath: "url-ics"
        mountPath: "/usr/share/jitsi-meet/static/url-ics"
      - name: "jitsi-meet-files"
        subPath: "url-logo"
        mountPath: "/usr/share/jitsi-meet/static/url-logo"
      - name: "jitsi-meet-files"
        subPath: "url-portal"
        mountPath: "/usr/share/jitsi-meet/static/url-portal"
    ingress:
      annotations:
        ingress.cilium.io/tcp-keep-alive: "enabled"
        ingress.cilium.io/websocket: "enabled"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.org/websocket-services: "jitsi-web"
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling.
    resources:
      requests:
        cpu: 0.1
        memory: "32Mi"
      limits:
        memory: "1Gi"

  prosody:
    image:
      tag: "stable-11248@sha256:5a478c431b7951f8c94c92dde7b7ac216a783d0bffa270cf84eadfa9fc110cb3"
    extraEnvs:
      AUTH_TYPE: "jwt"
      # See https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk/-/blob/main/helmfile/apps/jitsi/values-jitsi.yaml.gotmpl
      # for added extraEnvs during deployment
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling.
    resources:
      requests:
        cpu: 0.1
        memory: "32Mi"
      limits:
        memory: "1Gi"

  jicofo:
    image:
      tag: "stable-11248@sha256:adac7d81618aadd6a2158b72a33a3e23165787092bf5f89be210d92113d7e736"
    extraEnvs:
      AUTH_TYPE: "xmpp"
      ENABLE_AUTO_LOGIN: "false"
      JICOFO_AUTH_LIFETIME: "100 milliseconds"
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling the JVM process.
    resources:
      requests:
        cpu: 0.1
        memory: "384Mi"
      limits:
        memory: "4Gi"

  jvb:
    # -- Number of pods of a single JVB. The chart rejects a value greater than 1
    # while the JVB service is enabled, because all pods of a deployment are
    # reachable on the same service port. Use portRangeSize to run more than one
    # JVB.
    replicaCount: 1

    # -- Number of consecutive ports to allocate, one JVB per port. This is how
    # to run more than one JVB: each one is published on its own port of the JVB
    # service and advertised separately by the patchJVB job.
    portRangeSize: 1

    image:
      tag: "stable-11248@sha256:5542fd70a68148bf1ffc19d9a846ed17279ed20090e7c85beca3788a1c5350bd"
    service:
      externalTrafficPolicy: ""
      enabled: true
      type: "LoadBalancer"
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling the media process.
    resources:
      requests:
        cpu: 0.1
        memory: "384Mi"
      limits:
        memory: "4Gi"

  octo:
    enabled: true

  jibri:
    enabled: false
    recording: true
    livestreaming: true
    image:
      tag: "stable-11248@sha256:b45b7500283baf76b8e59a0aea1e4751f7cf2616ba8ebb2b376c36a21e6b7d05"
    readinessProbe:
      initialDelaySeconds: 15
      failureThreshold: 10
      timeoutSeconds: 3
    livenessProbe:
      initialDelaySeconds: 15
      failureThreshold: 10
      timeoutSeconds: 3
    shm:
      enabled: true
      useHost: false
      size: "2Gi"
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling the recording process.
    resources:
      requests:
        cpu: 0.1
        memory: "384Mi"
      limits:
        memory: "4Gi"

  jigasi:
    enabled: false
    image:
      tag: "stable-11248@sha256:a48e76f8d9910f4c7e60213eda964d9e987f9ccb97a0aed75f317922e09c0760"
    initContainers:
      busybox:
        # -- Image for the wait-for-prosody init container which waits until
        # Prosody accepts connections.
        image: "busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8"
    extraEnvs:
      JIGASI_ENABLE_REST: "true"
      JIGASI_SIP_DEFAULT_ROOM: "siptest@muc.meet.jitsi"
      # See https://gitlab.opencode.de/bmi/opendesk/deployment/opendesk/-/blob/main/helmfile/apps/jitsi/values-jitsi.yaml.gotmpl
      # for added extraEnvs during deployment
    # -- Resource requests and limits. No CPU limit is set on purpose to avoid
    # throttling the JVM process.
    resources:
      requests:
        cpu: 0.1
        memory: "384Mi"
      limits:
        memory: "4Gi"

  extraCommonEnvs:
    ADAPTER_INTERNAL_URL: "http://jitsi-keycloak-adapter:9000"
    TOOLBAR_BUTTONS: "camera,chat,closedcaptions,desktop,download,feedback,filmstrip,fullscreen,hangup,help,\
      invite,livestreaming,microphone,mute-everyone,mute-video-everyone,participants-pane,profile,raisehand,\
      security,select-background,settings,shareaudio,shortcuts,stats,tileview,toggle-camera,videoquality"

  tz: "Europe/Berlin"

# -- Lifecycle to automate configuration before or after startup
lifecycleHooks: {}

#  Configure extra options for containers probes.
livenessProbe:
  # -- Enables kubernetes LivenessProbe.
  enabled: true
  # -- Delay after container start until LivenessProbe is executed.
  initialDelaySeconds: 5
  # -- Time between probe executions.
  periodSeconds: 3
  # -- Timeout for command return.
  timeoutSeconds: 1
  # -- Number of failed executions until container is terminated.
  failureThreshold: 5
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1

# -- String to partially override release name.
nameOverride: ""

# -- Node labels for pod assignment
# Ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# -- Pod Annotations.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# -- Pod Labels.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Pod Security Context.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext:
  # -- Enable security context.
  enabled: false

# Role and RoleBinding used in patchJVB job.
rbac:
  # -- Enable RBAC Role and RoleBinding creation.
  create: true

#  Configure extra options for containers probes.
readinessProbe:
  # -- Enables kubernetes ReadinessProbe.
  enabled: true
  # -- Delay after container start until ReadinessProbe is executed.
  initialDelaySeconds: 5
  # -- Number of failed executions until container is terminated.
  failureThreshold: 15
  # -- Time between probe executions.
  periodSeconds: 2
  # -- Number of successful executions after failed ones until container is marked healthy.
  successThreshold: 1
  # -- Timeout for command return.
  timeoutSeconds: 1

# -- Set the amount of replicas of deployment.
replicaCount: 1

# Configure resource requests and limits.
#
# http://kubernetes.io/docs/user-guide/compute-resources/
#
resources:
  limits:
    # -- The max amount of CPUs to consume.
    cpu: "100m"
    # -- The max amount of RAM to consume.
    memory: "128Mi"
  requests:
    # -- The amount of CPUs which has to be available on the scheduled node.
    cpu: "10m"
    # -- The amount of RAM which has to be available on the scheduled node.
    memory: "16Mi"

# Define and create Kubernetes Service.
#
# Ref.: https://kubernetes.io/docs/concepts/services-networking/service
service:
  # -- Additional custom annotations
  annotations: {}

  # -- Enable kubernetes service creation.
  enabled: true

  # "ClusterIP" => Exposes the Service on a cluster-internal IP. Choosing this value makes the Service only reachable
  #                from within the cluster. This is the default that is used if you don't explicitly specify a type for
  #                a Service.
  # "NodePort" => Exposes the Service on each Node's IP at a static port (the NodePort). To make the node port
  #               available, Kubernetes sets up a cluster IP address, the same as if you had requested a Service of
  #               type: ClusterIP.
  # "LoadBalancer" => Exposes the Service externally using a cloud provider's load balancer.
  #
  # Ref.: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types

  # -- Choose the kind of Service, one of "ClusterIP", "NodePort" or "LoadBalancer".
  type: "ClusterIP"

  # Define the ports of Service.
  # You can set the port value to an arbitrary value, it will map the container port by name.
  #
  ports:
    adapter:
      # -- Accessible port for keycloak adapter.
      port: 9000
      # -- Internal port for keycloak adapter.
      containerPort: 9000
      # -- Keycloak adapter service protocol.
      protocol: "TCP"

# Service account to use.
# Ref.: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Allows auto mount of ServiceAccountToken on the serviceAccount created. Can be set to false if pods using this
  # serviceAccount do not need to use K8s API.
  automountServiceAccountToken: true

  # -- Enable creation of ServiceAccount for pod.
  create: true

  # -- Additional custom labels for the ServiceAccount.
  labels: {}

# Settings for jitsi keycloak adapter.
settings:
  # -- Keycloak realm name.
  keycloakRealm: "souvap"
  # -- Configured client id in keycloak.
  keycloakClientId: "jitsi"
  jwtAlg: "HS256"
  # Application secret known only to your token generators (such as keycloak-adapter)
  jwtAppSecret:
    # -- jwtAppSecret as plain value
    value: ""
    # jwtAppSecret from existing secret (higher precedence than plain value)
    existingSecret:
      # -- Name of the Kubernetes secret that contains the jwtAppSecret.
      name: ""
      # -- Key inside the Kubernetes secret that contains the jwtAppSecret.
      key: ""
  jwtExpSecond: "3600"
  jwtHash: "SHA-256"
  internalHostname: "0.0.0.0"
  # -- Set true if Keycloak has not a trusted certificate. For the production environment, Keycloak should have a
  # trusted certificate and this value should be false.
  allowUnsecureCert: "false"

# -- In seconds, time the given to the pod needs to terminate gracefully.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
terminationGracePeriodSeconds: ""

# -- Tolerations for pod assignment
# Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# -- Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
#
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: failure-domain.beta.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
topologySpreadConstraints: []

# Set up update strategy.
#
# Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
#
# Example:
# updateStrategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 25%
#    maxUnavailable: 25%
updateStrategy:
  # -- Set to Recreate if you use persistent volume that cannot be mounted by more than one pods to make sure the pods
  # is destroyed first.
  type: "RollingUpdate"

# Theming related settings.
theme:
  # -- The HTML title also used for the browser tab name.
  title: "Videokonferenz"

  # -- Topbar setting
  enableOldTopbar: true

  # -- Color settings.
  colors:
    background: "#121212"
    primary: "#5e27dd"
    secondaryGreyLight: "#f5f5f5"

